    app:
        name: Kafka
        code: kafka
        notify: appzdev@cloudbourne.co

    build:
        version: 4.0
        env: DEV
        build_file: none
        output_files: output/*.zip
        image_template: kafka-4.0

    deploy:
        context: tradeideas/DEV
        type: statefulset
        replicas: 1
        ingress: none
        resources: x-large
        port:
        - 9092
        - 9093

    volumes:
      - claim: kafka-data
        mount: /appz/data
        name: data
        size: 5Gi

    properties:
        KAFKA_CLUSTER_ID:
          vault: KAFKA_CLUSTER_ID
        MYSQL_REPLICATION_USER: replication
        MYSQL_REPLICATION_PASSWORD:
          vault: MYSQL_REPLICATION_PASSWORD
        MYSQL_TRACKER_PASSWORD:
          vault: MYSQL_MYDB_PASSWORD
        MYSQL_ECLOUDCONTROL_PASSWORD:
          vault: MYSQL_BARS_PASSWORD
        revision : 9
