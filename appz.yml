app:
    name: kafka
    code: kafka
    notify: mmushraf@ecloudcontrol.com
    
build:
    version: 4.0
    env: DEV
    build_file: none
    output_files: output/*.zip
    image_template: kafka-4.0
    
deploy:
    context: tradeideas/DEV
    type: statefulset
    replicas: 3
    port:
    - 9092
    - 9093

volumes:
  - claim: kafka-data
    mount: /appz/data
    name: data
    size: 5Gi

properties:
  KAFKA_REPLICATION_FACTOR: 3
  KAFKA_MIN_ISR: 2
  KAFKA_CLUSTER_ID:     
     vault: KAFKA_CLUSTER_ID

