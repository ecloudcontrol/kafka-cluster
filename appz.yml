    app:
        name: Kafka
        code: kafka
        notify: appzdev@cloudbourne.co

    build:
        version: 4.0
        env: DEV
        build_file: none
        output_files: output/*.zip
        image_template: kafka-4.0

    deploy:
        context: tradeideas/DEV
        type: statefulset
        replicas: 3
        #ingress: none
        #resources: x-large
        port:
        - 9092
        - 9093
        

    volumes:
      - claim: kafka-data
        mount: /appz/data
        name: data
        size: 5Gi

    properties:
        KAFKA_BROKERS: "0@kafka-cluster-4-0-0.kafka-cluster-4-0.tradeideas-dev.svc.cluster.local:9092,1@kafka-cluster-4-0-1.kafka-cluster-4-0.tradeideas-dev.svc.cluster.local:9092,2@kafka-cluster-4-0-2.kafka-cluster-4-0.tradeideas-dev.svc.cluster.local:9092"
        KAFKA_REPLICATION_FACTOR: 3
        KAFKA_MIN_ISR: 2
        KAFKA_CLUSTER_ID:
          vault: KAFKA_CLUSTER_ID
        KAFKA_CONTROLLER_UUID_0:
          vault: KAFKA_CONTROLLER_UUID_0
        KAFKA_CONTROLLER_UUID_1:
          vault: KAFKA_CONTROLLER_UUID_1
        KAFKA_CONTROLLER_UUID_2:
          vault: KAFKA_CONTROLLER_UUID_2
        KAFKA_BROKER_ID: "0"  # Default, overridden by ConfigMap
        KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:${EXTERNAL_PORT},CONTROLLER://0.0.0.0:${EXTERNAL_PORT}"
        KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-cluster-4-0-${KAFKA_BROKER_ID}.kafka-cluster-4-0.tradeideas-dev.svc.cluster.local:9092,EXTERNAL://10.0.1.5:${EXTERNAL_PORT},CONTROLLER://kafka-cluster-4-0-${KAFKA_BROKER_ID}.kafka-cluster-4-0.tradeideas-dev.svc.cluster.local:${EXTERNAL_PORT}"
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
        KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
        KAFKA_CONTROLLER_QUORUM_VOTERS: "0@kafka-cluster-4-0-0.kafka-cluster-4-0.tradeideas-dev.svc.cluster.local:30412,1@kafka-cluster-4-0-1.kafka-cluster-4-0.tradeideas-dev.svc.cluster.local:30716,2@kafka-cluster-4-0-2.kafka-cluster-4-0.tradeideas-dev.svc.cluster.local:31868"
        EXTERNAL_PORT: "30412"  # Default, overridden by ConfigMap
        revision : 12
