app:
  name: Kafka
  code: kafka
  notify: appzdev@cloudbourne.co

build:
  version: 4.0
  env: DEV
  build_file: none
  output_files: output/*.zip
  image_template: kafka-4.0

deploy:
  context: tradeideas/DEV
  type: statefulset
  replicas: 3
  #ingress: none
  resources: x-large
  port:
    - 9092
    - 9093

volumes:
  - claim: kafka-data
    mount: /appz/data
    name: data
    size: 5Gi
  - name: kafka-config-08
    configMap:
      name: kafka-config-0
  - name: kafka-config-1
    configMap:
      name: kafka-config-1
  - name: kafka-config-2
    configMap:
      name: kafka-config-2

properties:
  KAFKA_BROKERS: "0@10.0.1.6:31135,1@10.0.1.6:30716,2@10.0.1.6:31868"
  KAFKA_REPLICATION_FACTOR: 3
  KAFKA_MIN_ISR: 2
  KAFKA_CLUSTER_ID:
    vault: KAFKA_CLUSTER_ID
  KAFKA_CONTROLLER_UUID_0:
    vault: KAFKA_CONTROLLER_UUID_0
  KAFKA_CONTROLLER_UUID_1:
    vault: KAFKA_CONTROLLER_UUID_1
  KAFKA_CONTROLLER_UUID_2:
    vault: KAFKA_CONTROLLER_UUID_2
  revision: 9
