app:
    name: kafka
    code: kafka
    notify: mmushraf@ecloudcontrol.com
    
build:
    version: 4.0
    env: DEV
    build_file: none
    output_files: output/*.zip
    image_template: kafka-4.0
    
deploy:
    context: tradeideas/DEV
    type: statefulset
    replicas: 3
    port:
    - 9092
    - 9093

volumes:
  - claim: kafka-data
    mount: /appz/data
    name: data
    size: 5Gi

properties:

    #KAFKA_BROKERS: "0@kafka-0:9093,1@kafka-1:9093,2@kafka-2:9093"
  KAFKA_REPLICATION_FACTOR: 3
  KAFKA_MIN_ISR: 2
  KAFKA_CLUSTER_ID:     
     vault: KAFKA_CLUSTER_ID
  KAFKA_CONTROLLER_UUID_0:
     vault: KAFKA_CONTROLLER_UUID_0
  KAFKA_CONTROLLER_UUID_1: 
     vault: KAFKA_CONTROLLER_UUID_1
  KAFKA_CONTROLLER_UUID_2:
     vault: KAFKA_CONTROLLER_UUID_2
  KAFKA_CONTROLLER_UUID_3:
     vault: KAFKA_CONTROLLER_UUID_3
  revision : 9
     
