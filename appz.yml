    app:
        name: Kafka
        code: kafka
        notify: appzdev@cloudbourne.co

    build:
        version: 4.0
        env: DEV
        build_file: none
        output_files: output/*.zip
        image_template: kafka-4.0

    deploy:
        context: tradeideas/DEV
        type: statefulset
        replicas: 3
        ingress: none
        resources: x-large
        port:
        - 9092
        - 9093

    volumes:
      - claim: kafka-data
        mount: /appz/data
        name: data
        size: 5Gi

    properties:
        KAFKA_BROKERS: "0@10.0.1.6:31419,1@10.0.1.6:31620,2@10.0.1.6:31621"
          # External + Internal listener config
        KAFKA_LISTENERS: "EXTERNAL://0.0.0.0:9094,INTERNAL://0.0.0.0:9092"
        KAFKA_ADVERTISED_LISTENERS: "EXTERNAL://10.0.1.6:$(BROKER_NODEPORT),INTERNAL://$(HOSTNAME).kafka-cluster-4-0.tradeideas-dev.svc.cluster.local:9092"
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT"
        KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
        KAFKA_REPLICATION_FACTOR: 3
        KAFKA_MIN_ISR: 2
        KAFKA_CLUSTER_ID:
          vault: KAFKA_CLUSTER_ID
        KAFKA_CONTROLLER_UUID_0:
          vault: KAFKA_CONTROLLER_UUID_0
        KAFKA_CONTROLLER_UUID_1:
          vault: KAFKA_CONTROLLER_UUID_1
        KAFKA_CONTROLLER_UUID_2:
          vault: KAFKA_CONTROLLER_UUID_2
        revision : 6
